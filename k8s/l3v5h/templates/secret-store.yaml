{{- if .Values.global.useExternalSecrets }}
# ClusterSecretStore — описывает ОТКУДА брать секреты (Google Cloud Secret Manager).
# Аутентификация через Workload Identity: ESO использует свой K8s ServiceAccount
# который привязан к GCP SA "eso-sa" через WIF. Никаких JSON ключей.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloud-secret-store
spec:
  provider:
    gcpsm:
      projectID: l3v5h-506810
      auth:
        workloadIdentity:
          # K8s ServiceAccount ESO который привязан к GCP SA eso-sa через WIF.
          # Namespace и имя совпадают с дефолтной установкой ESO через Helm.
          clusterLocation: us-east4
          clusterName: l3v5h-cluster
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
{{- end }}
