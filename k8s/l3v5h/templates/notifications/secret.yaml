# ШАГ 3: Чтение шаблона и ветвление.
# Helm доходит до этого файла и проверяет рубильник из Шага 2 (useExternalSecrets).
{{- if .Values.global.useExternalSecrets }}

# ШАГ 4 (ПУТЬ А - ОБЛАКО): Если рубильник = true.
# Helm генерирует эту инструкцию (ExternalSecret) и отправляет её в Kubernetes.
# ВАЖНО: Helm НЕ качает секреты. Внутри кластера работает плагин, который прочитает 
# этот манифест, сам сходит в Google Cloud по ключу 'l3v5h-google-oauth-client-id' 
# и безопасно скачает пароль, создав обычный Secret рядом.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notifications-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cloud-secret-store
    kind: ClusterSecretStore
  target:
    name: notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_OAUTH_CLIENT_ID
      remoteRef:
        key: l3v5h-google-oauth-client-id
    - secretKey: GOOGLE_OAUTH_CLIENT_SECRET
      remoteRef:
        key: l3v5h-google-oauth-client-secret
    - secretKey: GOOGLE_OAUTH_REFRESH_TOKEN
      remoteRef:
        key: l3v5h-google-oauth-refresh-token
    - secretKey: SMTP_USER
      remoteRef:
        key: l3v5h-smtp-user
{{- else }}

# ШАГ 4 (ПУТЬ Б - ЛОКАЛЬНО): Если рубильник = false.
# Helm генерирует обычный Kubernetes Secret, подставляя значения напрямую из файла values.yaml (Шаг 2).
# Секрет сразу загружается в кластер, никаких внешних запросов к Google Cloud не происходит.
apiVersion: v1
kind: Secret
metadata:
  name: notifications-secret
type: Opaque
stringData:
  GOOGLE_OAUTH_CLIENT_ID: {{ .Values.notifications.googleOAuthClientId | quote }}
  GOOGLE_OAUTH_CLIENT_SECRET: {{ .Values.notifications.googleOAuthClientSecret | quote }}
  GOOGLE_OAUTH_REFRESH_TOKEN: {{ .Values.notifications.googleOAuthRefreshToken | quote }}
  SMTP_USER: {{ .Values.notifications.smtpUser | quote }}
{{- end }}