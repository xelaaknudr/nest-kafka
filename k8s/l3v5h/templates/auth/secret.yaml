{{- if .Values.global.useExternalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cloud-secret-store
    kind: ClusterSecretStore
  target:
    name: auth-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: l3v5h-postgres-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: l3v5h-jwt-secret
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.global.postgres.password | quote }}
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
{{- end }}