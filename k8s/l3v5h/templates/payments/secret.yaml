{{- if .Values.global.useExternalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cloud-secret-store
    kind: ClusterSecretStore
  target:
    name: payments-secret
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: l3v5h-stripe-secret-key
    - secretKey: GOOGLE_OAUTH_CLIENT_ID
      remoteRef:
        key: l3v5h-google-oauth-client-id
    - secretKey: GOOGLE_OAUTH_CLIENT_SECRET
      remoteRef:
        key: l3v5h-google-oauth-client-secret
    - secretKey: GOOGLE_OAUTH_REFRESH_TOKEN
      remoteRef:
        key: l3v5h-google-oauth-refresh-token
    - secretKey: SMTP_USER
      remoteRef:
        key: l3v5h-smtp-user
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: payments-secret
type: Opaque
stringData:
  STRIPE_SECRET_KEY: {{ .Values.payments.stripeSecretKey | quote }}
  GOOGLE_OAUTH_CLIENT_ID: {{ .Values.payments.googleOAuthClientId | quote }}
  GOOGLE_OAUTH_CLIENT_SECRET: {{ .Values.payments.googleOAuthClientSecret | quote }}
  GOOGLE_OAUTH_REFRESH_TOKEN: {{ .Values.payments.googleOAuthRefreshToken | quote }}
  SMTP_USER: {{ .Values.payments.smtpUser | quote }}
{{- end }}