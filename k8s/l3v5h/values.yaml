global:
  # ШАГ 2: Главный рубильник (Helm Values).
  # Здесь определяется логика того, откуда брать секреты.
  # true  -> Секреты тянутся из облака (Google Cloud) с помощью External Secrets Operator.
  # false -> Секреты берутся локально прямо из этого файла (секция ниже).
  useExternalSecrets: true

auth:
  image:
    repository: us-east4-docker.pkg.dev/l3v5h-506810/auth/production
    tag: latest

reservations:
  image:
    repository: us-east4-docker.pkg.dev/l3v5h-506810/reservations/production
    tag: latest

payments:
  image:
    repository: us-east4-docker.pkg.dev/l3v5h-506810/payments/production
    tag: latest

notifications:
  image:
    repository: us-east4-docker.pkg.dev/l3v5h-506810/notifications/production
    tag: latest

# Настройки для in-cluster базы данных
postgresql:
  image:
    tag: latest
  auth:
    existingSecret: "postgres-secret"
    secretKeys:
      adminPasswordKey: "POSTGRES_PASSWORD"
    database: "nestdb"
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 1Gi
# Настройки для RabbitMQ
rabbitmq:
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 3.13.4-debian-12-r0
  auth:
    username: rabbitmq
    password: rabbitmq
  replicaCount: 1
  rbac:
    create: false
