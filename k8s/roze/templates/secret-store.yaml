{{- if .Values.global.useExternalSecrets }}
# --- ИНТЕГРАЦИЯ С GOOGLE CLOUD SECRET MANAGER ---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloud-secret-store
spec:
  provider:
    gcpsm:
      projectID: roze-501818
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcpsm-secret
            key: secret-access-credentials
            namespace: default
{{- end }}
