{{- if .Values.global.useExternalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reservations-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: reservations-secret
    creationPolicy: Owner
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: roze-reservations-mongodb-uri
    - secretKey: JWT_SECRET
      remoteRef:
        key: roze-jwt-secret
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: reservations-secret
type: Opaque
stringData:
  MONGODB_URI: {{ .Values.reservations.mongodbUri | quote }}
  JWT_SECRET: {{ .Values.reservations.jwtSecret | quote }}
{{- end }}