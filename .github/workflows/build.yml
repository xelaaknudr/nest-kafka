name: 🔨 CD — Build & Push Images

on:
  workflow_run:
    workflows:
      - '✅ CI — Lint, Typecheck & Tests'
    types: [completed]
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # WIF (Workload Identity Federation) требует этих прав.
    # id-token: write  — разрешает GitHub выдать workflow OIDC токен.
    #                    Без него WIF не работает — Google не сможет проверить кто мы.
    # contents: read   — стандартное право для checkout репозитория.
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false # Other services continue building even if one fails
      matrix:
        include:
          - service: reservation
            dockerfile: apps/reservation/Dockerfile
            image: us-east4-docker.pkg.dev/l3v5h-506810/reservations/production

          - service: auth
            dockerfile: apps/auth/Dockerfile
            image: us-east4-docker.pkg.dev/l3v5h-506810/auth/production

          - service: notifications
            dockerfile: apps/notifications/Dockerfile
            image: us-east4-docker.pkg.dev/l3v5h-506810/notifications/production

          - service: payments
            dockerfile: apps/payments/Dockerfile
            image: us-east4-docker.pkg.dev/l3v5h-506810/payments/production

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 🔐 Authenticate to Google Cloud
        # WIF: GitHub отправляет OIDC токен в Google.
        # Google проверяет: токен из xelaaknudr/nest-kafka? → да → выдаёт временные credentials.
        # Никакого JSON ключа в GitHub Secrets — только WIF_PROVIDER и WIF_SA_EMAIL.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: 🐳 Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east4-docker.pkg.dev --quiet

      - name: 🏗️ Build image — ${{ matrix.service }}
        run: |
          docker build \
            -t ${{ matrix.image }}:${{ github.event.workflow_run.head_sha }} \
            -t ${{ matrix.image }}:latest \
            -f ${{ matrix.dockerfile }} \
            .

      - name: 📤 Push image — ${{ matrix.service }}
        run: |
          docker push ${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          docker push ${{ matrix.image }}:latest
