name: 🚀 CD (AWS) — Deploy to EKS

on:
  workflow_run:
    workflows:
      - '🔨 CD (AWS) — Build & Push Images'
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Helm upgrade → AWS EKS
    runs-on: ubuntu-latest
    environment: aws-production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ☸️ Get EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.AWS_EKS_CLUSTER_NAME }}

      - name: 🪖 Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: 🚀 Helm upgrade — deploy all services
        run: |
          helm upgrade --install roze-aws ./k8s/roze \
            --set global.cloudProvider=aws \
            --set reservations.image.repository=${{ secrets.AWS_ECR_REGISTRY }}/roze/reservation \
            --set reservations.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set auth.image.repository=${{ secrets.AWS_ECR_REGISTRY }}/roze/auth \
            --set auth.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set notifications.image.repository=${{ secrets.AWS_ECR_REGISTRY }}/roze/notifications \
            --set notifications.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set payments.image.repository=${{ secrets.AWS_ECR_REGISTRY }}/roze/payments \
            --set payments.image.tag=${{ github.event.workflow_run.head_sha }} \
            --debug \
            --atomic \
            --timeout 15m \
            --cleanup-on-fail

      - name: ✅ Verify rollout — all services
        run: |
          kubectl rollout status deployment/reservations --timeout=5m
          kubectl rollout status deployment/auth --timeout=5m
          kubectl rollout status deployment/notifications --timeout=5m
          kubectl rollout status deployment/payments --timeout=5m
