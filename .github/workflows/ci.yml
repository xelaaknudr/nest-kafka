name: ✅ CI — Lint, Typecheck & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 ESLint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📲 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run ESLint
        run: pnpm lint

  typecheck:
    name: 🔷 TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📲 Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: 🔷 Run TypeScript compiler check
      #   run: pnpm exec tsc --noEmit

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📲 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests with coverage
        run: pnpm test:cov

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    name: 🧪 E2E Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📝 Create stub .env files for CI
        # NestJS Joi validation requires these variables to boot the containers.
        run: |
          echo "POSTGRES_USER=postgres" > .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB=nestdb" >> .env
          
          echo "JWT_SECRET=supersecret" > apps/auth/.env
          echo "JWT_EXPIRATION=3600" >> apps/auth/.env
          echo "HTTP_PORT=3001" >> apps/auth/.env
          echo "TCP_PORT=3002" >> apps/auth/.env
          
          echo "HTTP_PORT=3000" > apps/reservation/.env
          echo "AUTH_HOST=auth" >> apps/reservation/.env
          echo "AUTH_PORT=3002" >> apps/reservation/.env
          echo "PAYMENTS_HOST=payments" >> apps/reservation/.env
          echo "PAYMENTS_PORT=3003" >> apps/reservation/.env
          
          echo "STRIPE_SECRET_KEY=sk_test_123" > apps/payments/.env
          echo "NOTIFICATIONS_HOST=notifications" >> apps/payments/.env
          echo "NOTIFICATIONS_PORT=3004" >> apps/payments/.env
          
          echo "SMTP_USER=test" > apps/notifications/.env
          echo "GOOGLE_OAUTH_CLIENT_ID=test" >> apps/notifications/.env
          echo "GOOGLE_OAUTH_CLIENT_SECRET=test" >> apps/notifications/.env
          echo "GOOGLE_OAUTH_REFRESH_TOKEN=test" >> apps/notifications/.env

      - name: 🚀 Run E2E Tests via Docker Compose
        run: |
          cd e2e
          docker compose up --build --exit-code-from e2e
