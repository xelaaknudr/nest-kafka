name: 🚀 CD — Deploy to GKE

on:
  workflow_run:
    workflows:
      - '🔨 CD — Build & Push Images'
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Helm upgrade → GKE
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # WIF требует права на получение OIDC токена от GitHub.
    permissions:
      id-token: write
      contents: write  # write нужен для git tag в последнем шаге

    steps:
      - name: 📥 Checkout
        # STEP 1: Checkout the source code.
        # We use the exact commit (head_sha) that was successfully built in the previous workflow (Build & Push Images).
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 🔐 Authenticate to Google Cloud
        # Тот же WIF что и в build.yml — никакого JSON ключа.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: ☸️ Get GKE credentials
        # STEP 3: Get Kubernetes (GKE) credentials.
        # This configures the cluster access so tools like kubectl and helm know where to connect.
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_CLUSTER_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: 🪖 Install Helm
        # STEP 4: Install the Helm CLI on the CI server (GitHub Actions).
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: 🔍 Helm dry-run (validate before deploy)
        # STEP 5: Validation (Dry Run).
        # The  flag renders all templates without applying them to the cluster.
        # It prevents syntax errors from breaking production by failing the pipeline early.
        run: |
          helm upgrade --install l3v5h ./k8s/l3v5h \
            --set reservations.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set auth.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set notifications.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set payments.image.tag=${{ github.event.workflow_run.head_sha }} \
            

      - name: 🚀 Helm upgrade — deploy all services
        # STEP 6: Actual production deployment (helm upgrade).
        run: |
          # WHY DO WE NEED --set *.image.tag FLAGS?
          # In the previous CI pipeline ("Build & Push Images"), Docker images were built 
          # and pushed with a unique tag - the commit hash (head_sha).
          # Here, we force Helm to ignore default tags in values.yaml and use these freshly built images.
          
          # WHY DO WE NEED SECURITY FLAGS (--atomic, --timeout, --cleanup-on-fail)?
          # --atomic: Guarantees "all-or-nothing" deployment. If the app crashes on startup 
          #           (e.g., Node.js throws an error), Helm will AUTOMATICALLY roll back 
          #           to the previous working version. Zero downtime for users.
          # --timeout 5m: Gives the cluster exactly 5 minutes for new pods to reach the 'Ready' state. 
          #               If they fail to do so, the deployment fails and triggers a rollback.
          # --cleanup-on-fail: Deletes any leftover "garbage" (stuck pods) if the deployment fails.
          
          helm upgrade --install l3v5h ./k8s/l3v5h \
            --set reservations.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set auth.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set notifications.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set payments.image.tag=${{ github.event.workflow_run.head_sha }} \
            --atomic \
            --timeout 5m \
            --cleanup-on-fail

      - name: ✅ Verify rollout — all services
        # STEP 7: Wait for readiness (Rollout).
        # This blocks the pipeline and monitors pod startup in real-time.
        # It provides extra assurance that Kubernetes successfully switched traffic to the new containers.
        run: |
          kubectl rollout status deployment/reservations --timeout=3m
          kubectl rollout status deployment/auth --timeout=3m
          kubectl rollout status deployment/notifications --timeout=3m
          kubectl rollout status deployment/payments --timeout=3m

      - name: 🗄️ Run Database Migrations
        # STEP 7.5: Execute migrations directly inside the running pods.
        # This uses zero extra cluster resources since it runs inside existing containers.
        run: |
          echo "Running Auth migrations..."
          kubectl exec deployment/auth -- pnpm run migration:run:auth

          echo "Running Reservation migrations..."
          kubectl exec deployment/reservations -- pnpm run migration:run:reservation

      - name: 🏷️ Tag deployed commit in Git
        # STEP 8: Tag the deployed commit in Git history.
        # If the deployment succeeds, we attach a "deployed-YYYYMMDD-HHMMSS" tag to the current commit.
        # This allows us to easily track which exact version is currently running in production.
        run: |
          DEPLOY_TAG="deployed-$(date +'%Y%m%d-%H%M%S')"
          git tag $DEPLOY_TAG ${{ github.event.workflow_run.head_sha }}
          git push origin $DEPLOY_TAG
