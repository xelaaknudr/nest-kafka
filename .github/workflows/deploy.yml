name: 🚀 CD — Deploy to GKE

on:
  workflow_run:
    workflows:
      - '🔨 CD — Build & Push Images'
    types: [completed]
    branches: [main]

# Запрещаем параллельные деплои — они опасны и могут привести к гонке условий.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Helm upgrade → GKE
    runs-on: ubuntu-latest
    environment: production
    # Запускаемся только если предыдущий пайплайн (сборка образов) завершился успешно.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # WIF (Workload Identity Federation) требует права на получение OIDC-токена от GitHub.
    # Это позволяет аутентифицироваться в GCP без хранения JSON-ключей в секретах.
    permissions:
      id-token: write
      contents: write # нужен для git tag в финальном шаге

    steps:
      # ─────────────────────────────────────────────────────────────
      # ЭТАП 1: Подготовка окружения
      # ─────────────────────────────────────────────────────────────

      - name: 📥 Checkout
        # Берём точный коммит (head_sha), который был успешно собран предыдущим пайплайном.
        # Это гарантирует, что мы деплоим именно тот код, из которого были собраны образы.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 🔐 Authenticate to Google Cloud
        # Используем Workload Identity Federation вместо JSON-ключа сервисного аккаунта.
        # Это более безопасный способ — токен выдаётся на один запуск и автоматически истекает.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: ☸️ Get GKE credentials
        # Настраиваем kubectl/helm для работы с нашим конкретным GKE-кластером.
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_CLUSTER_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: 🪖 Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: 📦 Helm dependency build
        # Скачиваем внешние зависимости чарта (Bitnami PostgreSQL).
        # Они не хранятся в Git, поэтому их нужно загружать при каждом запуске.
        run: helm dependency build ./k8s/l3v5h

      # ─────────────────────────────────────────────────────────────
      # ЭТАП 2: Валидация (без применения изменений)
      # ─────────────────────────────────────────────────────────────

      - name: 🔍 Helm dry-run
        # Рендерим все шаблоны и проверяем их синтаксис без отправки в кластер.
        # Это позволяет поймать ошибки в YAML/шаблонах до того, как они сломают прод.
        run: |
          helm upgrade --install l3v5h ./k8s/l3v5h \
            --dry-run \
            --set reservations.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set auth.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set notifications.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set payments.image.tag=${{ github.event.workflow_run.head_sha }}

      # ─────────────────────────────────────────────────────────────
      # ЭТАП 3: Миграции базы данных
      #
      # ВАЖНО: Миграции запускаются ДО деплоя нового кода намеренно.
      # Это классический подход "expand-first":
      #   1. Сначала расширяем схему БД (миграции). Схема остаётся совместимой со старым кодом.
      #   2. Затем деплоим новый код. Поды стартуют и сразу видят готовые таблицы.
      #
      # Если бы мы делали наоборот (сначала деплой, потом миграции), новые поды
      # падали бы с ошибкой "table not found" до завершения миграций.
      # ─────────────────────────────────────────────────────────────

      - name: 📦 Install Node.js dependencies for migrations
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 🗄️ Run Database Migrations
        # Мы запускаем TypeORM CLI прямо на раннере, а не внутри пода.
        # Причина: продакшн-образы собраны через Webpack в один main.js
        # и не содержат ts-node и .ts файлов миграций.
        # Доступ к базе обеспечивается через kubectl port-forward.
        run: |
          export POSTGRES_PASSWORD=$(kubectl get secret postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 --decode)
          export POSTGRES_USER=postgres
          export POSTGRES_DB=nestdb
          export POSTGRES_HOST=127.0.0.1
          export POSTGRES_PORT=5432

          echo "Waiting for postgres pod to be Ready..."
          kubectl wait pod -l app.kubernetes.io/name=postgresql --for=condition=Ready --timeout=5m

          echo "Opening tunnel to PostgreSQL..."
          kubectl port-forward svc/l3v5h-postgresql 5432:5432 &
          PF_PID=$!
          sleep 5

          echo "Running Auth migrations..."
          pnpm run migration:run:auth

          echo "Running Reservations migrations..."
          pnpm run migration:run:reservation

          kill $PF_PID

      # ─────────────────────────────────────────────────────────────
      # ЭТАП 4: Деплой
      # ─────────────────────────────────────────────────────────────

      - name: 🚀 Helm upgrade — deploy all services
        run: |
          helm upgrade --install l3v5h ./k8s/l3v5h \
            --set reservations.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set auth.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set notifications.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set payments.image.tag=${{ github.event.workflow_run.head_sha }} \
            --atomic \
            --timeout 5m \
            --cleanup-on-fail
          # --atomic:           "всё или ничего" — если хоть один под не стартует за timeout,
          #                     Helm автоматически откатит весь релиз к предыдущей рабочей версии.
          # --timeout 5m:       максимальное время ожидания готовности подов.
          # --cleanup-on-fail:  удаляет зависшие поды при неудачном деплое.

      # ─────────────────────────────────────────────────────────────
      # ЭТАП 5: Финализация
      # ─────────────────────────────────────────────────────────────

      - name: 🏷️ Tag deployed commit in Git
        # Ставим Git-тег на задеплоенный коммит для удобного отслеживания того,
        # какая версия кода сейчас запущена в проде.
        run: |
          DEPLOY_TAG="deployed-$(date +'%Y%m%d-%H%M%S')"
          git tag $DEPLOY_TAG ${{ github.event.workflow_run.head_sha }}
          git push origin $DEPLOY_TAG
