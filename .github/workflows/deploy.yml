name: 🚀 CD — Deploy to GKE

on:
  workflow_run:
    workflows:
      - '🔨 CD — Build & Push Images'
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Helm upgrade → GKE
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # WIF требует права на получение OIDC токена от GitHub.
    permissions:
      id-token: write
      contents: write  # write нужен для git tag в последнем шаге

    steps:
      - name: 📥 Checkout
        # STEP 1: Checkout the source code.
        # We use the exact commit (head_sha) that was successfully built in the previous workflow (Build & Push Images).
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 🔐 Authenticate to Google Cloud
        # Тот же WIF что и в build.yml — никакого JSON ключа.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_EMAIL }}

      - name: ☸️ Get GKE credentials
        # STEP 3: Get Kubernetes (GKE) credentials.
        # This configures the cluster access so tools like kubectl and helm know where to connect.
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_CLUSTER_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: 🪖 Install Helm
        # STEP 4: Install the Helm CLI on the CI server (GitHub Actions).
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: 📦 Helm dependency build
        # Fetch external dependencies (e.g., Bitnami PostgreSQL)
        run: helm dependency build ./k8s/l3v5h

      - name: 🔍 Helm dry-run (validate before deploy)
        # STEP 5: Validation (Dry Run).
        # The flag renders all templates without applying them to the cluster.
        # It prevents syntax errors from breaking production by failing the pipeline early.
        run: |
          helm upgrade --install l3v5h ./k8s/l3v5h \
            --set reservations.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set auth.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set notifications.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set payments.image.tag=${{ github.event.workflow_run.head_sha }} \
            

      - name: 🚀 Helm upgrade — deploy all services
        # STEP 6: Actual production deployment (helm upgrade).
        run: |
          helm upgrade --install l3v5h ./k8s/l3v5h \
            --set reservations.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set auth.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set notifications.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set payments.image.tag=${{ github.event.workflow_run.head_sha }}

      - name: 🗄️ Run Database Migrations
        # STEP 7: Execute migrations from the CI runner using port-forwarding.
        # This MUST run before rollout verification because pods won't become 'Ready' until tables exist.
        run: |
          npm i -g pnpm@9
          pnpm install --frozen-lockfile
          
          export POSTGRES_PASSWORD=$(kubectl get secret postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 --decode)
          export POSTGRES_USER=postgres
          export POSTGRES_DB=nestdb
          export POSTGRES_HOST=127.0.0.1
          export POSTGRES_PORT=5432
          
          kubectl port-forward svc/l3v5h-postgresql 5432:5432 &
          PF_PID=$!
          sleep 5 # Wait for tunnel
          
          echo "Running Auth migrations..."
          pnpm run migration:run:auth
          
          echo "Running Reservation migrations..."
          pnpm run migration:run:reservation
          
          kill $PF_PID

      - name: ✅ Verify rollout — all services
        # STEP 8: Wait for readiness (Rollout).
        # Now that migrations are done, the crash-looping pods will recover and become Ready.
        run: |
          kubectl rollout status deployment/reservations --timeout=5m
          kubectl rollout status deployment/auth --timeout=5m
          kubectl rollout status deployment/notifications --timeout=5m
          kubectl rollout status deployment/payments --timeout=5m

      - name: 🏷️ Tag deployed commit in Git
        # STEP 8: Tag the deployed commit in Git history.
        # If the deployment succeeds, we attach a "deployed-YYYYMMDD-HHMMSS" tag to the current commit.
        # This allows us to easily track which exact version is currently running in production.
        run: |
          DEPLOY_TAG="deployed-$(date +'%Y%m%d-%H%M%S')"
          git tag $DEPLOY_TAG ${{ github.event.workflow_run.head_sha }}
          git push origin $DEPLOY_TAG
